[package]
name = "usb-most-connection"
version = "1.0.13"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
qr-scan = ["dep:quircs"]

[dependencies]
quircs = { version = "=0.10.3", optional = true }
usb-most-protocol = { path = "../usb-most-protocol" }
zeroize = { version = "=1.9.1", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "zeroize"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring", "rsa"] }
base64 = "=0.22.1"
ring = "=0.17.14"
subtle = "=2.6.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
qrcodegen = "=1.8.0"
tempfile = "=3.27.0"
log = "=0.4.35"

[target.'cfg(windows)'.dependencies]
usb-most-platform = { path = "../usb-most-platform" }
