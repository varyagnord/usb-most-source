[package]
name = "usb-most-platform"
version = "1.0.11"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[example]]
name = "eject_linux_lab"
required-features = ["linux-eject"]

[features]
shell-ui = ["dep:windows"]
firewall = ["dep:windows", "windows/Win32_NetworkManagement_WindowsFirewall"]
linux-eject = ["dep:zbus", "dep:tokio", "dep:usb-most-protocol", "dep:rustix"]
windows-eject = ["dep:usb-most-protocol", "windows-sys/Win32_System_Registry"]

[dependencies]
usb-most-protocol = { path = "../usb-most-protocol", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=6.2.1", optional = true, default-features = false, features = ["tokio", "proxy"] }
tokio = { version = "=1.54.1", optional = true, default-features = false, features = ["rt", "time"] }
rustix = { version = "=1.1.6", optional = true, default-features = false, features = ["std", "fs", "event"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile = "=3.27.0"
zbus = { version = "=6.2.1", default-features = false, features = ["tokio", "proxy", "service"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, default-features = false, features = ["std", "Win32_Foundation", "Win32_System_Com", "Win32_System_Variant", "Win32_System_Registry", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zeroize = { version = "=1.9.1", default-features = false, features = ["std"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_Threading", "Win32_System_Services", "Win32_Networking_WinSock", "Win32_Devices_DeviceAndDriverInstallation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
