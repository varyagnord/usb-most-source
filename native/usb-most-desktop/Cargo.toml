[package]
name = "usb-most-desktop"
version = "1.0.13"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[[example]]
name = "managed_linux_lab"
required-features = ["managed-eject-lab"]

[features]
# Explicit isolated-QEMU test harness, never enabled for a product build.
managed-eject-lab = []
installation = []
bundled-driver = ["installation", "local-ui"]
local-ui = ["dep:axum", "dep:qrcodegen", "dep:if-addrs", "dep:subtle", "usb-most-platform/shell-ui", "tokio/process"]

[dependencies]
qrcodegen = { version = "=1.8.0", optional = true }
if-addrs = { version = "=0.15.0", optional = true }
subtle = { version = "=2.6.1", optional = true }
mdns-sd = { version = "=0.21.7", default-features = false }
socket2 = "=0.6.5"
axum = { version = "=0.8.9", optional = true, default-features = false, features = ["http1", "json", "tokio"] }
usb-most-connection = { path = "../usb-most-connection" }
usb-most-protocol = { path = "../usb-most-protocol" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.9.1", default-features = false, features = ["std"] }
base64 = "=0.22.1"
ring = "=0.17.14"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process", "fs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[target.'cfg(windows)'.dependencies]
usb-most-platform = { path = "../usb-most-platform", features = ["firewall", "windows-eject"] }

[target.'cfg(target_os = "linux")'.dependencies]
usb-most-platform = { path = "../usb-most-platform", features = ["linux-eject"] }

[build-dependencies]
serde_json = "=1.0.154"
ring = "=0.17.14"
